name: Verificar redes en cabecera
on:
  push:
    branches: [redes-cabecera-20260918]
    paths: [.github/workflows/prepare-header-social.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redes-cabecera-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agregar enlaces a la cabecera sin alterar contenido
        run: |
          python - <<'PY'
          import hashlib, re
          from pathlib import Path
          page=Path('index.html')
          raw=page.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a7e0bfbe95dbb984189408180e25ac6f03b5a088', 'Source changed; review before editing'
          original=raw.decode('utf-8')
          assert 'class="header-social-links"' not in original
          panel=original.split('<section class="social-links-panel"',1)[1].split('</section>',1)[0]
          links=re.findall(r'<a class="social-link-button[^>]*>[\s\S]*?</a>',panel)
          assert len(links)==2
          links=[a.replace('social-link-button','header-social-link') for a in links]
          block='\n          <li class="header-social-links">\n            '+'\n            '.join(a.strip() for a in links)+'\n          </li>'
          marker='          <li><a href="#contacto">Contacto</a></li>'
          assert original.count(marker)==1
          css='''    /* Redes en cabecera: enlaces simples, sin seguimiento ni SDK externos. */
              .menu .header-social-links{display:flex;align-items:center;gap:8px;flex:0 0 auto}
              .menu a.header-social-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 12px;border:1px solid transparent;color:#fff;font-size:15px;line-height:1.4;white-space:nowrap;text-decoration:none}
              .menu a.header-social-link--facebook{background:#0866c6}
              .menu a.header-social-link--tiktok{background:#171717}
              .menu a.header-social-link:hover{color:#fff;filter:brightness(.92);text-decoration:underline;text-underline-offset:3px}
              .menu a.header-social-link:focus-visible{outline:3px solid #651709;outline-offset:3px}
              .header-social-link svg{display:block;width:20px;height:20px;flex:0 0 20px;fill:currentColor}
              .site-header:has(:focus-visible){transform:translateY(0)}
              @media(min-width:801px){.site-nav .menu{column-gap:16px;row-gap:8px}}
              @media(max-width:800px){.menu a.header-social-link{width:44px;padding:8px}.header-social-link span{display:none}}
          '''
          updated=original.replace(marker,marker+block,1).replace('</style>',css+'</style>',1)
          assert updated.replace(block,'',1).replace(css,'',1)==original
          assert original.split('<main',1)[1]==updated.split('<main',1)[1], 'Main content must stay identical'
          assert re.findall(r'https://wa.me/[^"\s]+',original)==re.findall(r'https://wa.me/[^"\s]+',updated)
          page.write_text(updated,encoding='utf-8')
          print('OK: only header HTML/CSS changed; main, footer, contact and social destinations preserved')
          PY
          python scripts/validate_site.py
          python scripts/validate_otc_catalog.py
          git diff --check
      - name: Preparar navegador de pruebas
        run: |
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Verificar cabecera en computadora y celular
        run: |
          python - <<'PY'
          import base64,json,os,shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['RUNNER_TEMP'])/'header-checks';out.mkdir(exist_ok=True)
          html=Path('index.html').read_text(encoding='utf-8')
          img=base64.b64encode(Path('logo-dr-juan-web.webp').read_bytes()).decode()
          html=html.replace('src="logo-dr-juan-web.webp"','src="data:image/webp;base64,'+img+'"')
          expected=['https://www.facebook.com/boticasdeldrjuan','https://www.tiktok.com/@boticasdeldrjuan']
          results=[]
          with sync_playwright() as p:
              exe=shutil.which('google-chrome') or shutil.which('chromium')
              browser=p.chromium.launch(executable_path=exe,headless=True,args=['--no-sandbox'])
              for width,js in [(w,True) for w in [320,360,390,650,768,800,801,900,950,1024,1175,1366]]+[(390,False)]:
                  ctx=browser.new_context(viewport={'width':width,'height':900},java_script_enabled=js,reduced_motion='reduce')
                  page=ctx.new_page();page.set_content(html);page.wait_for_timeout(100)
                  if js:
                      page.evaluate("document.addEventListener('click',e=>{const a=e.target.closest('a.header-social-link');if(a){e.preventDefault();window.lastTestHref=a.href;}})")
                  links=page.locator('#site-header a.header-social-link')
                  assert links.count()==2
                  assert page.locator('#redes-sociales .social-link-button').count()==2
                  assert page.locator('.menu a[href^="#"]').count()==5
                  assert not page.evaluate('document.documentElement.scrollWidth > innerWidth')
                  boxes=[]
                  for i,url in enumerate(expected):
                      link=links.nth(i)
                      assert link.is_visible()
                      assert link.get_attribute('href')==url and link.get_attribute('target')=='_blank'
                      assert {'noopener','noreferrer'}<=set(link.get_attribute('rel').split())
                      assert link.get_attribute('aria-label') and link.locator('svg').count()==1
                      box=link.bounding_box();boxes.append(box)
                      assert box['width']>=44 and box['height']>=44
                      assert box['x']>=0 and box['x']+box['width']<=width+1
                      link.focus()
                      if js:
                          link.press('Enter')
                          assert page.evaluate('window.lastTestHref')==url
                  if js:
                      page.evaluate("document.getElementById('site-header').classList.add('mobile-header-hidden')")
                      page.locator('.menu a[href="#contacto"]').focus()
                      page.keyboard.press('Tab')
                      assert page.evaluate("document.activeElement.classList.contains('header-social-link--facebook')")
                      assert links.nth(0).bounding_box()['y']>=0
                      page.keyboard.press('Tab')
                      assert page.evaluate("document.activeElement.classList.contains('header-social-link--tiktok')")
                      page.evaluate("document.activeElement.blur();document.getElementById('site-header').classList.remove('mobile-header-hidden')")
                  header=page.locator('#site-header')
                  header.screenshot(path=str(out/f'header-{width}-js-{js}.png'))
                  results.append({'width':width,'javascript':js,'headerHeight':header.bounding_box()['height'],'links':expected,'buttonBoxes':boxes,'result':'PASS'})
                  ctx.close()
              browser.close()
          (out/'results.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          print('PASS: 13 viewport/JS combinations. Keyboard activations intercepted; no requests sent to social platforms.')
          PY
      - name: Conservar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-social-checks
          path: ${{ runner.temp }}/header-checks
          retention-days: 7
      - name: Guardar solo el cambio solicitado en la rama
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/prepare-header-social.yml
          git commit -m 'Agregar Facebook y TikTok a la cabecera institucional'
          git push origin HEAD:redes-cabecera-20260918
