name: Validar sitio

on:
  push:
    branches:
      - chatgpt-mejora-integral-web
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar HTML, enlaces y datos esenciales
        run: python scripts/validate_site.py
